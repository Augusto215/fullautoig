<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>extensionsIG.avl</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">S</div>
      <div class="brand-copy">
        <strong>extensionsIG.avl</strong>
        <span>Foto, bio, Story e destaque</span>
      </div>
      <span class="session-mark" title="A publicação usa a sessão atual do Instagram">IG</span>
    </header>

    <main>
      <section class="media-section" aria-labelledby="media-heading">
        <div class="section-heading">
          <h1 id="media-heading">Mídia do story</h1>
          <span>9:16</span>
        </div>
        <div class="preview-frame" id="preview-frame">
          <img id="preview" alt="Prévia da imagem do story" hidden>
          <button class="sticker-preview" id="sticker-preview" type="button" hidden aria-label="Adesivo do link centralizado na imagem">
            <svg class="sticker-link-icon" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="ig-link-gradient" x1="0" y1="1" x2="1" y2="0">
                  <stop offset="0%" stop-color="#feda75"/>
                  <stop offset="36%" stop-color="#fa7e1e"/>
                  <stop offset="68%" stop-color="#d62976"/>
                  <stop offset="100%" stop-color="#962fbf"/>
                </linearGradient>
              </defs>
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71m2.25 5.82a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" fill="none" stroke="url(#ig-link-gradient)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
            </svg>
            <span class="sticker-copy">
              <span class="sticker-link-title" id="sticker-link-title">CLICA AQUI 🎁🔞</span>
            </span>
          </button>
          <div class="empty-preview" id="empty-preview">
            <span class="empty-mark" aria-hidden="true">+</span>
            <strong>Nenhuma imagem selecionada</strong>
          </div>
        </div>
        <div class="media-controls">
          <button class="choose-button" id="choose-image" type="button">Escolher arquivo</button>
          <label class="fit-control" for="fit-mode">
            <span>Enquadramento</span>
            <select id="fit-mode">
              <option value="cover">Preencher</option>
              <option value="contain">Ajustar</option>
            </select>
          </label>
          <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" hidden>
        </div>
      </section>

      <section class="details-section" aria-label="Detalhes da publicação">
        <label class="field">
          <span>Link do adesivo <em>opcional</em></span>
          <input id="link-url" type="url" value="t.me/alicemont_bot?start=init">
        </label>
        <label class="field">
          <span>Texto do link <em>opcional</em></span>
          <input id="link-title" type="text" value="CLICA AQUI 🎁🔞">
        </label>
        <label class="field">
          <span>Título do destaque <em>opcional</em></span>
          <input id="highlight-title" type="text" value="🎁🔞">
        </label>
      </section>

      <section class="profile-section" aria-label="Foto de perfil">
        <div class="section-heading"><h2>Foto de perfil</h2><span>Imagem salva</span></div>
        <div class="profile-control-row">
          <img id="profile-preview" class="profile-preview" alt="Prévia da foto de perfil" hidden>
          <span id="profile-empty" class="profile-empty" aria-hidden="true">+</span>
          <div class="profile-detail">
            <button id="choose-profile" type="button">Selecionar foto</button>
            <span id="profile-note">Foto padrão incluída. Não precisa selecionar.</span>
          </div>
          <input id="profile-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" hidden>
        </div>
        <label class="field bio-control" for="profile-bio">
          <span>Bio configurada</span>
          <input id="profile-bio" type="text" maxlength="150" value="18 | BR">
        </label>
      </section>

      <div class="actions">
        <button class="save-button" id="save-config" type="button" disabled>Salvar</button>
        <button class="publish-button" id="publish" type="button" disabled>Só story + destaque</button>
        <button class="all-button" id="run-all" type="button" disabled>Fazer tudo (1 clique)</button>
        <button class="save-button" id="edit-profile-only" type="button">Testar foto + bio (sem Story)</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
